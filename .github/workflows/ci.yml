name: CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/shrutsharma958/integration-aggregator:${{ github.sha }} \
            -t ghcr.io/shrutsharma958/integration-aggregator:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/shrutsharma958/integration-aggregator:${{ github.sha }}
          docker push ghcr.io/shrutsharma958/integration-aggregator:latest

  integration:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Start application
        run: make up

      - name: Check pods
        run: kubectl get pods

      - name: Check services
        run: kubectl get services

      - name: Health smoke test
        run: |
          kubectl port-forward service/integration-aggregator 8080:8080 >/tmp/port-forward.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz